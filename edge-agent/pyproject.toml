[project]
name = "zion-agent"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "cryptography>=43", "onvif-zeep-async>=3.1", "jinja2>=3.1"]

[project.scripts]
zion-agent = "agent.main:cli"
vms-agent = "agent.main:cli"   # old name, kept for compatibility

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.tunnel" = ["*.tmpl"]
