[project]
name = "vms-data-plane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "onvif-zeep-async>=3.1",
  "cryptography>=43",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["hardware: needs a real NVR (set VMS_TEST_NVR_* env vars)"]
addopts = "-m 'not hardware'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the intended pattern.
# BLE001: probe/driver fallbacks catch broadly on purpose so one failing step doesn't abort the probe.
ignore = ["B008", "BLE001"]
